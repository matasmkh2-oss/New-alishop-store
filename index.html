<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6955ed">
  <meta name="description" content="علي شوب لبيع المنتجات الرقمية">
  <title>علي شوب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="header">
    <a href="#/home" class="brand">
      <span class="logo">A</span>
      <span><strong>علي شوب</strong><small>متجر المنتجات الرقمية</small></span>
    </a>

    <nav class="desktop-nav">
      <a href="#/home" data-route="home">الرئيسية</a>
      <a href="#/products" data-route="products">المنتجات</a>
      <a href="#/orders" data-route="orders">طلباتي</a>
      <a href="#/wallet" data-route="wallet">المحفظة</a>
      <a href="#/account" data-route="account">حسابي</a>
      <a href="#/admin" data-route="admin" id="adminLink" class="hidden">الإدارة</a>
    </nav>

    <div class="actions">
      <button id="themeButton" class="icon-button" aria-label="تبديل المظهر">☾</button>
      <button id="authButton" class="button primary">تسجيل الدخول</button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="mobile-nav">
    <a href="#/home" data-route="home"><b>⌂</b><span>الرئيسية</span></a>
    <a href="#/products" data-route="products"><b>▦</b><span>المنتجات</span></a>
    <a href="#/orders" data-route="orders"><b>▣</b><span>طلباتي</span></a>
    <a href="#/wallet" data-route="wallet"><b>◉</b><span>المحفظة</span></a>
    <a href="#/account" data-route="account"><b>●</b><span>حسابي</span></a>
  </nav>

  <dialog id="authDialog" class="dialog">
    <form id="authForm">
      <div class="dialog-head">
        <div><h2 id="authTitle">تسجيل الدخول</h2><p>ادخل بيانات حسابك.</p></div>
        <button type="button" class="close" data-close="authDialog">×</button>
      </div>

      <div id="registerFields" class="hidden">
        <label>الاسم الكامل<input id="fullName" type="text"></label>
        <label>رقم الهاتف<input id="phone" type="tel"></label>
      </div>

      <label>البريد الإلكتروني<input id="email" type="email" required></label>
      <label>كلمة المرور<input id="password" type="password" minlength="6" required></label>
      <button id="authSubmit" class="button primary block" type="submit">دخول</button>
      <button id="switchAuth" type="button" class="text-button">ليس لديك حساب؟ أنشئ حسابًا</button>
    </form>
  </dialog>

  <dialog id="modal" class="dialog wide"></dialog>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
